<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR Approval App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">PR Approval System</p>
        <h1>ระบบขอซื้อและติดตามอนุมัติ</h1>
        <p class="subtitle">สร้าง PR, อนุมัติ, ปฏิเสธ, ปิดงาน และ export CSV ได้ทันที ไม่ต้องติดตั้งอะไรเพิ่ม</p>
      </div>
      <div class="hero-actions">
        <button id="seedBtn" class="ghost">โหลดข้อมูลตัวอย่าง</button>
        <button id="exportBtn" class="secondary">Export CSV</button>
        <button id="clearBtn" class="danger">ล้างข้อมูล</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="grid">
      <form id="prForm" class="card form-card">
        <h2>สร้าง PR ใหม่</h2>
        <label>ผู้ขอ<input name="requester" required placeholder="เช่น คุณตังค์" /></label>
        <label>แผนก<input name="department" required placeholder="เช่น จัดซื้อ / คลินิก / การตลาด" /></label>
        <label>Vendor<input name="vendor" placeholder="ชื่อร้านค้า / บริษัท" /></label>
        <label>รายการ<textarea name="item" required placeholder="รายละเอียดสินค้า/บริการ"></textarea></label>
        <div class="two">
          <label>จำนวนเงิน <input name="amount" type="number" min="0" step="0.01" required placeholder="0.00" /></label>
          <label>ผู้อนุมัติถัดไป
            <select name="nextApprover">
              <option>Manager</option>
              <option>Finance</option>
              <option>Partner 1</option>
              <option>Partner 2</option>
              <option>Partner 3</option>
            </select>
          </label>
        </div>
        <label>เหตุผล<textarea name="reason" placeholder="ทำไมต้องซื้อ / ใช้กับงานไหน"></textarea></label>
        <button class="primary" type="submit">สร้างเอกสาร PR</button>
      </form>

      <section class="card">
        <div class="toolbar">
          <h2>รายการเอกสาร</h2>
          <input id="searchInput" placeholder="ค้นหา PR, ผู้ขอ, vendor, สถานะ" />
        </div>
        <div id="prList" class="list"></div>
      </section>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button id="closeDialog" class="ghost">ปิด</button>
    </div>
    <div id="modalBody"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
